name: iOS TestFlight

# Builds, signs, and uploads the iOS client to TestFlight from a macOS cloud
# runner — no local Mac required. Trigger it manually (Actions tab → Run
# workflow) or by pushing a tag like `ios-v1.1.2`.
#
# One-time setup (see clients/ios/README.md): add these repo secrets via
# `scripts/ios-prepare-secrets.ps1` or the GitHub UI:
#   IOS_DIST_CERT_BASE64        base64 of your Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD      password used when exporting that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision
#   IOS_KEYCHAIN_PASSWORD       any throwaway string (temp keychain)
#   APPSTORE_API_KEY_BASE64     base64 of the App Store Connect AuthKey_XXX.p8
#   APPSTORE_KEY_ID             the API key's Key ID
#   APPSTORE_ISSUER_ID          the API key's Issuer ID

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight 'What to Test' notes"
        required: false
        default: "CI build"
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    env:
      PROJECT: clients/android/CopilotBridgeAndroid.csproj
      ASC_KEY_PATH: ${{ runner.temp }}/asc_key.p8
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            echo "Using $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PWD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Make the imported key usable by codesign without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          # Put our keychain at the front of the search list (keep the rest).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then echo "No codesigning identity found in keychain"; exit 1; fi
          echo "Signing identity: $IDENTITY"
          echo "CODESIGN_KEY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          cp "$PROFILE_PATH" "$DEST/$UUID.mobileprovision"
          echo "Provisioning profile: $NAME ($UUID)"
          echo "CODESIGN_PROVISION=$NAME" >> "$GITHUB_ENV"

      - name: Build & sign .ipa
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT" -f net9.0-ios -c Release \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION"
          IPA=$(find clients/android/bin/Release/net9.0-ios/ios-arm64/publish -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then echo "No .ipa produced"; exit 1; fi
          echo "Built: $IPA"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: echo "$ASC_KEY_B64" | base64 --decode > "$ASC_KEY_PATH"

      - name: Upload to TestFlight
        working-directory: clients/android
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: fastlane beta

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" || true
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
