<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copilot">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Copilot Bridge</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#21262d; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --user:#1f6feb; --err:#f85149;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
    height:100dvh;
  }
  header{
    display:flex; align-items:center; gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5;
  }
  header .logo{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--accent); font-weight:700}
  header h1{font-size:16px; margin:0; flex:1; font-weight:600}
  header button{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer;
  }
  header .iconbtn{position:relative; min-width:36px; min-height:34px}
  .badge{
    position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; padding:0 5px;
    border-radius:9px; background:var(--err); color:#fff; border:2px solid var(--panel);
    font:700 10px/14px ui-monospace,Menlo,Consolas,monospace; text-align:center;
  }
  .badge[hidden]{display:none}
  header button:active{background:#2d333b}
  #log{flex:1; overflow-y:auto; padding:14px 12px 8px; -webkit-overflow-scrolling:touch}
  .msg{margin:10px 0; display:flex}
  .msg.user{justify-content:flex-end}
  .bubble{
    max-width:86%; padding:10px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word;
    border:1px solid var(--border); background:var(--panel);
  }
  .user .bubble{background:var(--user); border-color:var(--user); color:#fff; border-bottom-right-radius:4px}
  .bot .bubble{border-bottom-left-radius:4px}
  .err .bubble{border-color:var(--err); color:var(--err)}
  .bubble pre{
    background:#0b0f14; border:1px solid var(--border); border-radius:8px; padding:10px;
    overflow-x:auto; margin:6px 0; font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; white-space:pre;
  }
  .bubble code{font-family:ui-monospace,Menlo,Consolas,monospace; background:#0b0f14; padding:1px 5px; border-radius:5px}
  .meta{font-size:11px; color:var(--muted); margin:2px 4px}
  .think{color:var(--muted); font-style:italic}
  form{
    display:flex; flex-wrap:wrap; gap:8px; padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:var(--panel); border-top:1px solid var(--border);
  }
  textarea{
    flex:1; resize:none; max-height:140px; min-height:44px;
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:11px 12px; font:16px/1.4 inherit;
  }
  textarea:focus{outline:none; border-color:var(--accent)}
  #send{
    background:var(--accent); color:#fff; border:none; border-radius:12px;
    padding:0 18px; font-size:16px; font-weight:600; cursor:pointer;
  }
  #send:disabled{opacity:.5}
  /* image attachments */
  #attachBtn{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:0 14px; font-size:18px; cursor:pointer; min-height:44px;
  }
  #attachBtn:active{background:#2d333b}
  #fileInput{display:none}
  #previews{display:flex; flex-wrap:wrap; gap:8px; flex-basis:100%; order:-1}
  #previews:empty{display:none}
  .pthumb{position:relative; width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--bg)}
  .pthumb img{width:100%; height:100%; object-fit:cover; display:block}
  .pthumb .x{
    position:absolute; top:2px; right:2px; width:20px; height:20px; line-height:18px; text-align:center;
    background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; font-size:12px; cursor:pointer; padding:0;
  }
  .bubble .thumbs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px}
  .bubble .thumbs.only{margin:0}
  .bubble .thumbs a{display:block; width:180px; max-width:60vw}
  .bubble .thumbs img{width:100%; border-radius:10px; border:1px solid var(--border); display:block}
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:20;
  }
  .modal.show{display:flex}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; width:100%; max-width:420px}
  .card h2{margin:0 0 12px; font-size:17px}
  .card label{display:block; font-size:13px; color:var(--muted); margin:12px 0 5px}
  .card input{width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:10px}
  .card .row{display:flex; gap:8px; margin-top:16px}
  .card .row button{flex:1; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:14px}
  .card .row button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .hint{font-size:12px; color:var(--muted); margin-top:10px}

  /* sessions drawer */
  #scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:14}
  #scrim.show{display:block}
  #drawer{
    position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; z-index:15;
    background:var(--panel); border-right:1px solid var(--border);
    transform:translateX(-100%); transition:transform .22s ease; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #drawer.show{transform:none}
  #drawer .dhead{display:flex; align-items:center; gap:8px; padding:14px 12px; border-bottom:1px solid var(--border)}
  #drawer .dhead h2{font-size:15px; margin:0; flex:1}
  #drawer .dnew{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 10px; font-size:13px; font-weight:600}
  #drawer .dnew.dghost{background:var(--panel2); color:var(--text); border:1px solid var(--border); font-weight:500}
  #slist{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .sback{display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:1px solid var(--border); color:var(--accent); font-size:14px; cursor:pointer; background:var(--panel2)}
  .snote{padding:10px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--border)}
  .ssearch{padding:8px 10px; border-bottom:1px solid var(--border)}
  .ssearch input{width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:9px 11px; font:14px/1.3 inherit; -webkit-appearance:none}
  .ssearch input:focus{outline:none; border-color:var(--accent)}
  .machine-filters{display:flex; gap:6px; padding:8px 10px; overflow-x:auto; border-bottom:1px solid var(--border); scrollbar-width:thin}
  .machine-filter{flex:0 0 auto; padding:6px 9px; border:1px solid var(--border); border-radius:7px; background:var(--panel2); color:var(--text); font:12px/1.2 inherit; cursor:pointer; white-space:nowrap}
  .machine-filter.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .short-filter{display:flex; align-items:center; gap:7px; min-height:38px; padding:7px 10px; border-bottom:1px solid var(--border); color:var(--text); font-size:12px}
  .short-filter-toggle{display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer}
  .short-filter input[type="checkbox"]{position:absolute; opacity:0; pointer-events:none}
  .short-filter .track{position:relative; flex:0 0 auto; width:32px; height:18px; border:1px solid var(--border); border-radius:9px; background:var(--bg)}
  .short-filter .track::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--muted); transition:transform .15s ease,background .15s ease}
  .short-filter input[type="checkbox"]:checked + .track{background:var(--accent); border-color:var(--accent)}
  .short-filter input[type="checkbox"]:checked + .track::after{transform:translateX(14px); background:#fff}
  .short-filter .label{flex:1; min-width:0}
  .short-filter .threshold{box-sizing:border-box; flex:0 0 46px; width:46px; height:28px; padding:3px 2px 3px 7px; border:1px solid var(--border); border-radius:7px; background:var(--bg); color:var(--text); font:12px/1 inherit; text-align:center}
  .short-filter .threshold:focus{outline:none; border-color:var(--accent)}
  .short-filter .unit{white-space:nowrap}
  .short-filter .count{color:var(--muted); white-space:nowrap}
  .sitem{display:flex; align-items:center; gap:8px; padding:12px; border-bottom:1px solid var(--border); cursor:pointer}
  .sitem.active{background:var(--panel2)}
  .sitem .stitle{flex:1; min-width:0}
  .sitem .stitle .t{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sitem .stitle .sub{font-size:11px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sitem .del{background:none; border:none; color:var(--muted); font-size:16px; padding:4px 6px; cursor:pointer}
  .sitem .del:active{color:var(--err)}
  .sitem .imp{background:none; border:1px solid var(--border); border-radius:7px; color:var(--accent); font-size:12px; padding:5px 9px; cursor:pointer; white-space:nowrap}

  /* prompt timeline */
  #timeline{
    position:fixed; top:0; right:0; bottom:0; width:88%; max-width:380px; z-index:15;
    background:var(--panel); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #timeline.show{transform:none}
  #timeline .thead{display:flex; align-items:center; gap:8px; padding:14px 12px; border-bottom:1px solid var(--border)}
  #timeline .thead h2{font-size:15px; margin:0; flex:1}
  #timeline .tclose{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer}
  #tlist{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .titem{display:grid; grid-template-columns:32px minmax(0,1fr); gap:8px; width:100%; padding:12px; border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--text); text-align:left; cursor:pointer}
  .titem:hover,.titem.active{background:var(--panel2)}
  .titem .tnum{color:var(--muted); font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; text-align:right}
  .titem .tpreview{display:block; font:13px/1.45 inherit; overflow-wrap:anywhere}
  .titem .tmeta{display:block; font-size:11px; color:var(--muted); margin-top:3px}
  .msg.turn-flash .bubble{animation:turnFlash 1.25s ease-out}
  @keyframes turnFlash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
  @media (prefers-reduced-motion:reduce){#drawer,#timeline{transition:none}.msg.turn-flash .bubble{animation:none;outline:2px solid var(--accent)}}

  /* unified inbox / AI dashboard */
  #inboxDrawer{
    position:fixed; top:0; right:0; bottom:0; width:92%; max-width:440px; z-index:15;
    background:var(--panel); border-left:1px solid var(--border);
    transform:translateX(100%); transition:transform .22s ease; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #inboxDrawer.show{transform:none}
  #inboxDrawer .ihead{display:flex; align-items:center; gap:8px; padding:14px 12px; border-bottom:1px solid var(--border)}
  #inboxDrawer .ihead h2{font-size:15px; margin:0; flex:1}
  #inboxDrawer .iclose{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; width:32px; height:32px; cursor:pointer}
  .dashstats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-bottom:1px solid var(--border)}
  .dashstat{padding:12px 8px; text-align:center; border-right:1px solid var(--border)}
  .dashstat:last-child{border-right:0}
  .dashstat strong{display:block; font:700 18px/1.2 ui-monospace,Menlo,Consolas,monospace}
  .dashstat span{display:block; color:var(--muted); font-size:11px; margin-top:3px}
  .notification-setup{padding:10px 12px; border-bottom:1px solid var(--border); background:rgba(47,129,247,.1)}
  .notification-setup strong{display:block; font-size:13px}
  .notification-setup span{display:block; color:var(--muted); font-size:12px; line-height:1.45; margin-top:3px}
  .dashactions{display:flex; gap:7px; padding:9px 10px; border-bottom:1px solid var(--border); overflow-x:auto}
  .dashactions button{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12px; white-space:nowrap; cursor:pointer}
  .dashactions #enableNotifyBtn.setup-primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .syncsetup{padding:10px 12px; border-bottom:1px solid var(--border)}
  .syncsetup.setup-primary{background:rgba(47,129,247,.1)}
  .syncsetup strong{display:block; font-size:13px}
  .syncsetup span{display:block; color:var(--muted); font-size:12px; line-height:1.45; margin-top:3px; overflow-wrap:anywhere}
  .syncactions{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px}
  .syncactions button{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12px; cursor:pointer}
  .syncactions #connectSyncBtn{background:var(--accent); color:#fff; border-color:var(--accent)}
  #inboxList{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .inbox-section{padding:8px 12px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; border-bottom:1px solid var(--border)}
  .jobrow,.inboxitem{display:flex; gap:10px; padding:11px 12px; border-bottom:1px solid var(--border)}
  .jobrow{align-items:center; cursor:pointer}
  .jobdot{width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(47,129,247,.18)}
  .inboxitem{cursor:pointer; background:transparent; color:var(--text)}
  .inboxitem:hover,.inboxitem.unread{background:var(--panel2)}
  .sourcepill{flex:0 0 auto; align-self:flex-start; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:2px 5px; font:10px/1.4 ui-monospace,Menlo,Consolas,monospace}
  .inboxbody{min-width:0; flex:1}
  .inboxtitle{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .inboxsummary{display:-webkit-box; font-size:12px; color:var(--muted); margin-top:3px; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .inboxmeta{display:block; font-size:10px; color:var(--muted); margin-top:5px}
  .inboxignore{align-self:flex-start; background:none; border:0; color:var(--muted); cursor:pointer; padding:2px 4px}
  @media (prefers-reduced-motion:reduce){#inboxDrawer{transition:none}}

  /* markdown */
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:.5em 0 .3em; line-height:1.25}
  .bubble h1{font-size:1.3em} .bubble h2{font-size:1.18em} .bubble h3{font-size:1.07em} .bubble h4{font-size:1em}
  .bubble p{margin:.4em 0}
  .bubble ul,.bubble ol{margin:.4em 0; padding-left:1.4em}
  .bubble li{margin:.15em 0}
  .bubble blockquote{margin:.4em 0; padding:.2em .8em; border-left:3px solid var(--border); color:var(--muted)}
  .bubble hr{border:none; border-top:1px solid var(--border); margin:.6em 0}
  .bubble a{color:var(--accent)}
  .bubble table{border-collapse:collapse; margin:.5em 0; width:100%; font-size:13px; display:block; overflow-x:auto}
  .bubble th,.bubble td{border:1px solid var(--border); padding:5px 8px; text-align:left}
  .bubble th{background:var(--panel2)}
  .think .t{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <button id="menuBtn" title="会话列表" aria-label="会话列表">☰</button>
  <span class="logo">&gt;_</span>
  <h1>Copilot Bridge</h1>
  <button class="iconbtn" id="inboxBtn" title="AI Dashboard" aria-label="AI Dashboard">●<span class="badge" id="inboxBadge" hidden></span></button>
  <button class="iconbtn" id="timelineBtn" title="输入时间线" aria-label="输入时间线">☷</button>
  <button class="iconbtn" id="setBtn" title="设置">⚙</button>
</header>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead">
    <h2>会话</h2>
    <button class="dnew dghost" id="importBtn" title="查看全部机器的会话历史">History</button>
    <button class="dnew" id="newBtn">＋ 新会话</button>
  </div>
  <div id="slist"></div>
</aside>

<aside id="timeline" aria-label="输入时间线">
  <div class="thead">
    <h2>输入时间线</h2>
    <button class="tclose" id="timelineClose" title="关闭" aria-label="关闭">×</button>
  </div>
  <div id="tlist"></div>
</aside>

<aside id="inboxDrawer" aria-label="AI Dashboard">
  <div class="ihead">
    <h2>AI Dashboard</h2>
    <button class="iclose" id="inboxClose" title="关闭" aria-label="关闭">×</button>
  </div>
  <div class="dashstats">
    <div class="dashstat"><strong id="unreadStat">0</strong><span>待查看</span></div>
    <div class="dashstat"><strong id="runningStat">0</strong><span>正在运行</span></div>
    <div class="dashstat"><strong id="watchedStat">0</strong><span>监控会话</span></div>
  </div>
  <div class="notification-setup" id="notificationSetupNotice" hidden>
    <strong>开启 AI 回复提醒</strong>
    <span id="notificationSetupMessage">点击“允许浏览器通知”，然后在 Edge 的提示中选择“允许”。</span>
  </div>
  <div class="dashactions">
    <button id="scanInboxBtn" type="button">立即扫描</button>
    <button id="markInboxSeenBtn" type="button">全部已读</button>
    <button id="enableNotifyBtn" type="button">允许浏览器通知</button>
  </div>
  <div class="syncsetup" id="syncSetupPanel">
    <strong>OneDrive 会话同步</strong>
    <span id="syncStatusMessage">正在读取同步状态…</span>
    <div class="syncactions">
      <button id="connectSyncBtn" type="button">连接 OneDrive</button>
      <button id="runSyncBtn" type="button" hidden>立即同步</button>
      <button id="disconnectSyncBtn" type="button" hidden>断开</button>
    </div>
  </div>
  <div id="inboxList"></div>
</aside>

<div id="log"></div>

<form id="form">
  <div id="previews"></div>
  <button id="attachBtn" type="button" title="添加图片" aria-label="添加图片">📎</button>
  <input id="fileInput" type="file" accept="image/*" multiple>
  <textarea id="input" placeholder="给 Copilot agent 下指令…" autocomplete="off"></textarea>
  <button id="send" type="submit">发送</button>
</form>

<div class="modal" id="modal">
  <div class="card">
    <h2>设置</h2>
    <label>服务器地址（默认当前地址，一般不用改）</label>
    <input id="baseInput" placeholder="https://xxx-3978.xxx.devtunnels.ms">

    <div id="msBlock" style="display:none">
      <label>Microsoft 账号登录</label>
      <div id="msStatus" class="hint" style="margin:0 0 8px">未登录</div>
      <div class="row" style="margin-bottom:4px">
        <button id="msSignIn" type="button" class="primary">使用 Microsoft 登录</button>
        <button id="msSignOut" type="button" style="display:none">退出登录</button>
      </div>
    </div>

    <div id="tokenBlock">
      <label>API Token</label>
      <input id="tokenInput" type="password" placeholder="粘贴 .env 里的 CHAT_API_TOKEN">
    </div>

    <label>输入时间线预览字符数</label>
    <input id="previewLengthInput" type="number" min="20" max="1000" step="10" inputmode="numeric">

    <div class="row">
      <button id="cancelBtn" type="button">取消</button>
      <button id="saveBtn" type="button" class="primary">保存</button>
    </div>
      <div class="hint">本机 localhost 无需登录；通过 Dev Tunnel 远程访问时，Microsoft 登录会在打开本页前完成。</div>
  </div>
</div>

<script src="/vendor/msal-browser.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const log = $('#log'), input = $('#input'), form = $('#form'), sendBtn = $('#send');
const drawer = $('#drawer'), scrim = $('#scrim'), slist = $('#slist');
const timeline = $('#timeline'), tlist = $('#tlist');
const inboxDrawer = $('#inboxDrawer'), inboxList = $('#inboxList'), inboxBadge = $('#inboxBadge');
const fileInput = $('#fileInput'), previews = $('#previews'), attachBtn = $('#attachBtn');

let base  = (localStorage.getItem('cb_base')  || location.origin).replace(/\/$/,'');
let token = localStorage.getItem('cb_token') || window.__CB_KEY || '';
const initialParams = new URLSearchParams(location.search);
let sid   = initialParams.get('conversation') || localStorage.getItem('cb_sid') || '';

// Microsoft Entra ID sign-in (optional; driven by /api/webconfig). When the user

let authCfg = null;         // the server's /api/webconfig payload

function hdr(){
  const h = {'Content-Type':'application/json','X-Tunnel-Skip-AntiPhishing-Page':'true'};
  if(msToken) h['Authorization'] = 'Bearer ' + msToken;
  else if(token) h['X-API-Key'] = token;
  return h;
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function scroll(){ log.scrollTop = log.scrollHeight; }

async function api(method, path, body){
  if(msalApp && msAccount && (!msToken || Date.now() > msTokenExp - 300000)){
    await acquireToken(true);
  }
  const opt = { method, headers: hdr() };
  if(body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(base + path, opt);
  if(r.status === 401){ openModal(); throw new Error('unauthorized'); }
  const ct = r.headers.get('content-type') || '';
  const result = ct.includes('json') ? await r.json() : await r.text();
  if(!r.ok) throw new Error((result && result.error) || ('HTTP ' + r.status));
  return result;
}

/* ---------- markdown (GFM subset, matches the native clients) ---------- */
function inline(s){
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ codes.push('<code>'+c+'</code>'); return '\u0000C'+(codes.length-1)+'\u0000'; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,t,u)=> /^(https?:|mailto:)/i.test(u) ? '<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>' : m);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\u0000C(\d+)\u0000/g, (m,n)=>codes[+n]);
  return s;
}
function mdToHtml(src){
  const blocks = [];
  src = String(src).replace(/```([\s\S]*?)```/g, (m, code) => {
    code = code.replace(/^[^\n]*\n/, '');               // drop the ```lang line
    blocks.push('<pre>' + esc(code.replace(/\n$/,'')) + '</pre>');
    return '\u0000B' + (blocks.length-1) + '\u0000';
  });
  const lines = src.split('\n');
  let html = '', i = 0;
  const isBreak = l => /^\s*$/.test(l) || /^\u0000B\d+\u0000$/.test(l) || /^(#{1,6})\s/.test(l)
    || /^\s*>\s?/.test(l) || /^\s*([-*+]|\d+\.)\s+/.test(l) || /^\s*([-*_])\1{2,}\s*$/.test(l);
  while(i < lines.length){
    const line = lines[i];
    const ph = line.match(/^\u0000B(\d+)\u0000$/);
    if(ph){ html += blocks[+ph[1]]; i++; continue; }
    if(/^\s*$/.test(line)){ i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ html += '<hr>'; i++; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; html += '<h'+n+'>' + inline(h[2]) + '</h'+n+'>'; i++; continue; }
    if(/^\s*>\s?/.test(line)){
      const buf = [];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html += '<blockquote>' + inline(buf.join('\n')).replace(/\n/g,'<br>') + '</blockquote>'; continue;
    }
    if(line.includes('|') && i+1<lines.length && /-/.test(lines[i+1]) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      const row = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      const head = row(line); i += 2;
      let t = '<table><thead><tr>' + head.map(c=>'<th>'+inline(c)+'</th>').join('') + '</tr></thead><tbody>';
      while(i<lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])){
        t += '<tr>' + row(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('') + '</tr>'; i++;
      }
      html += t + '</tbody></table>'; continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){
      const ordered = /^\s*\d+\.\s+/.test(line), tag = ordered ? 'ol' : 'ul';
      let l = '<'+tag+'>';
      while(i<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        l += '<li>' + inline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,'')) + '</li>'; i++;
      }
      html += l + '</'+tag+'>'; continue;
    }
    const buf = [line]; i++;
    while(i<lines.length && !isBreak(lines[i])){ buf.push(lines[i]); i++; }
    html += '<p>' + inline(buf.join('\n')).replace(/\n/g,'<br>') + '</p>';
  }
  return html;
}

/* ---------- messages ---------- */
function addMsg(kind, text, images, turnId){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + kind;
  if(turnId) wrap.dataset.turnId = turnId;
  const b = document.createElement('div');
  b.className = 'bubble';
  let html = '';
  if(images && images.length){
    html += '<div class="thumbs' + (text ? '' : ' only') + '">' + images.map(im =>
      '<a href="' + im.src + '" target="_blank" rel="noopener"><img alt="' + esc(im.name || '') + '" src="' + im.src + '"></a>'
    ).join('') + '</div>';
  }
  if(text) html += (kind === 'bot') ? mdToHtml(text) : esc(text).replace(/\n/g,'<br>');
  b.innerHTML = html;
  wrap.appendChild(b); log.appendChild(wrap); scroll();
  return wrap;
}

/* ---------- image attachments ---------- */
// Build an authorized URL for a stored attachment so a plain <img> can load it
// (img tags can't send the X-API-Key header, so the server also accepts ?key=).
function attUrl(a){
  let u = base + a.url;
  const sep = () => (u.includes('?') ? '&' : '?');
  if(msToken) u += sep() + 'access_token=' + encodeURIComponent(msToken);
  else if(token) u += sep() + 'key=' + encodeURIComponent(token);
  return u;
}
function fileToDataUrl(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.onerror = ()=> rej(r.error || new Error('read failed'));
    r.readAsDataURL(file);
  });
}
function splitDataUrl(dataUrl){
  const i = dataUrl.indexOf(',');
  const head = dataUrl.slice(0, i);
  const b64 = dataUrl.slice(i + 1);
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/png';
  return { mime, b64 };
}
function renderPending(){
  previews.innerHTML = '';
  pending.forEach((p, idx)=>{
    const d = document.createElement('div');
    d.className = 'pthumb';
    d.innerHTML = '<img alt=""><button class="x" title="移除" type="button">✕</button>';
    d.querySelector('img').src = p.dataUrl;
    d.querySelector('.x').onclick = ()=>{ pending.splice(idx, 1); renderPending(); updateSendEnabled(); };
    previews.appendChild(d);
  });
}
function updateSendEnabled(){
  sendBtn.disabled = !(input.value.trim() || pending.length);
}
async function addFiles(files){
  for(const f of files){
    if(!f.type || !f.type.startsWith('image/')) continue;
    try{
      const dataUrl = await fileToDataUrl(f);
      const { mime, b64 } = splitDataUrl(dataUrl);
      pending.push({ name: f.name || ('image.' + ((mime.split('/')[1]) || 'png')), mime, dataUrl, b64 });
    }catch(e){ /* skip unreadable file */ }
  }
  renderPending(); updateSendEnabled();
}
function addThinking(start){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML = '<div class="bubble think"></div>';
  log.appendChild(wrap); scroll();
  wrap._t0 = Date.now();
  wrap._queued = !!(start && start.status === 'queued' && (start.queuePosition||0) > 0);
  wrap._qpos = start ? (start.queuePosition||0) : 0;
  const fmtDur = (ms)=>{
    const s = Math.round(ms/1000);
    if(s < 60) return s + 's';
    const m = Math.floor(s/60);
    if(m < 60) return m + 'm ' + (s%60) + 's';
    return Math.floor(m/60) + 'h ' + (m%60) + 'm';
  };
  const paint = ()=>{
    const el = wrap.querySelector('.bubble'); if(!el) return;
    if(wrap._queued && wrap._qpos > 0){ el.textContent = '⏳ 排队中… 前面还有 ' + wrap._qpos + ' 个请求'; return; }
    const ms = Date.now() - wrap._t0;
    // No timeout: Copilot is given as long as it needs. Show elapsed time, and for
    // long tasks reassure the user that waiting (or leaving) is fine.
    let html = '🤖 Copilot 正在工作… <span class="t">' + fmtDur(ms) + '</span>';
    if(ms > 60000)
      html += '<div style="font-size:12px;color:var(--muted);margin-top:6px">'
        + '长任务执行中，无需关闭页面；即使离开，结果也会保存到本会话。</div>';
    el.innerHTML = html;
  };
  paint();
  const timer = setInterval(paint, 1000);
  wrap._stop = ()=> clearInterval(timer);
  wrap._update = (st)=>{
    const was = wrap._queued;
    wrap._queued = (st.status === 'queued' && (st.queuePosition||0) > 0);
    wrap._qpos = st.queuePosition || 0;
    if(was && !wrap._queued) wrap._t0 = Date.now();   // restart the think timer when it leaves the queue
    paint();
  };
  return wrap;
}

/* ---------- sessions ---------- */
function relTime(ts){
  if(!ts) return '';
  const sec = ts > 1e12 ? ts/1000 : ts;
  const d = Math.max(0, Date.now()/1000 - sec);
  if(d < 60) return '刚刚';
  if(d < 3600) return Math.floor(d/60) + ' 分钟前';
  if(d < 86400) return Math.floor(d/3600) + ' 小时前';
  return Math.floor(d/86400) + ' 天前';
}
function sessionPromptCount(session){
  const exact = Number(session && session.promptCount);
  if(Number.isFinite(exact)) return Math.max(0, exact);
  return Math.ceil(Math.max(0, Number(session && session.messageCount) || 0) / 2);
}
function isShortSession(session){ return sessionPromptCount(session) <= shortSessionPrompts; }
function shortFilterControl(candidates, onChange){
  const control = document.createElement('div');
  control.className = 'short-filter';
  control.title = '按用户提问次数隐藏短会话；不会删除数据';
  control.innerHTML = '<label class="short-filter-toggle"><input type="checkbox">'
    + '<span class="track" aria-hidden="true"></span><span class="label">隐藏不超过</span></label>'
    + '<input class="threshold" type="number" min="0" max="99" step="1" inputmode="numeric">'
    + '<span class="unit">轮问答</span><span class="count"></span>';
  const checkbox = control.querySelector('input[type="checkbox"]');
  const threshold = control.querySelector('.threshold');
  checkbox.checked = hideShortSessions;
  checkbox.setAttribute('aria-label', '隐藏短会话');
  threshold.value = String(shortSessionPrompts);
  threshold.setAttribute('aria-label', '短会话问答次数阈值');
  const updateCount = ()=>{
    const hidden = candidates.filter(session => isShortSession(session)
      && (session.conversationId || session.id) !== sid).length;
    control.querySelector('.count').textContent = hideShortSessions ? '已隐藏 ' + hidden : '显示全部';
  };
  updateCount();
  checkbox.onchange = ()=>{
    hideShortSessions = checkbox.checked;
    localStorage.setItem('cb_hide_short_sessions', hideShortSessions ? 'true' : 'false');
    updateCount();
    onChange();
  };
  threshold.onchange = ()=>{
    const parsed = Number.parseInt(threshold.value, 10);
    shortSessionPrompts = Number.isFinite(parsed) ? Math.min(99, Math.max(0, parsed)) : 2;
    threshold.value = String(shortSessionPrompts);
    localStorage.setItem('cb_short_session_prompts', String(shortSessionPrompts));
    updateCount();
    onChange();
  };
  return control;
}
function renderSessions(){
  slist.innerHTML = '';
  if(!sessions.length){ slist.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px">还没有会话，点上面「新会话」开始。</div>'; return; }
  slist.appendChild(shortFilterControl(sessions, renderSessions));
  const visible = sessions.filter(s => !hideShortSessions || s.id === sid || !isShortSession(s));
  if(!visible.length){
    slist.insertAdjacentHTML('beforeend', '<div class="snote">没有较长的会话；关闭上方筛选可查看全部。</div>');
    return;
  }
  for(const s of visible){
    const item = document.createElement('div');
    item.className = 'sitem' + (s.id === sid ? ' active' : '');
    const title = (s.title && s.title.trim()) ? s.title : '未命名会话';
    item.innerHTML = '<div class="stitle"><div class="t"></div><div class="sub">'
      + relTime(s.updatedAt) + ' · ' + (s.messageCount||0) + ' 条</div></div>'
      + '<button class="del" title="删除">🗑</button>';
    item.querySelector('.t').textContent = title;
    item.querySelector('.stitle').onclick = ()=> openSession(s.id);
    item.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); delSession(s.id, title); };
    slist.appendChild(item);
  }
}
async function loadSessions(){
  try{ sessions = await api('GET','/api/sessions') || []; }
  catch(e){ sessions = []; }
  renderSessions();
}

/* ---------- prompt timeline ---------- */
function updateLocation(turnId){
  const url = new URL(location.href);
  if(sid) url.searchParams.set('conversation', sid); else url.searchParams.delete('conversation');
  if(turnId) url.searchParams.set('turn', turnId); else url.searchParams.delete('turn');
  history.replaceState(null, '', url.pathname + url.search + url.hash);
}
function renderTimeline(activeTurnId){
  tlist.innerHTML = '';
  if(!turns.length){
    tlist.innerHTML = '<div class="snote">这个会话还没有用户输入。</div>';
    return;
  }
  for(const turn of turns){
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'titem' + (turn.id === activeTurnId ? ' active' : '');
    const number = document.createElement('span');
    number.className = 'tnum';
    number.textContent = String(turn.ordinal).padStart(2, '0');
    const body = document.createElement('span');
    const preview = document.createElement('span');
    preview.className = 'tpreview';
    preview.textContent = turn.previewText || '(空输入)';
    const meta = document.createElement('span');
    meta.className = 'tmeta';
    meta.textContent = relTime(turn.createdAt) + ' · ' + (turn.messageCount || 0) + ' 条';
    body.append(preview, meta);
    item.append(number, body);
    item.onclick = ()=> goToTurn(turn.id);
    tlist.appendChild(item);
  }
}
async function loadTimeline(activeTurnId){
  if(!sid){ turns = []; renderTimeline(); return; }
  try{
    turns = await api('GET','/api/sessions/' + encodeURIComponent(sid) + '/turns') || [];
    renderTimeline(activeTurnId);
  }catch(e){
    turns = [];
    tlist.innerHTML = '<div class="snote">读取输入时间线失败：' + esc(e.message) + '</div>';
  }
}
function findTurnElement(turnId){
  return [...log.querySelectorAll('.msg[data-turn-id]')]
    .find(el => el.dataset.turnId === turnId && el.classList.contains('user'))
    || [...log.querySelectorAll('.msg[data-turn-id]')].find(el => el.dataset.turnId === turnId);
}
async function goToTurn(turnId){
  let target = findTurnElement(turnId);
  if(!target){ await openSession(sid, turnId); return; }
  closeTimeline();
  target.scrollIntoView({ behavior:'smooth', block:'start' });
  target.classList.remove('turn-flash');
  void target.offsetWidth;
  target.classList.add('turn-flash');
  setTimeout(()=>target.classList.remove('turn-flash'), 1400);
  renderTimeline(turnId);
  updateLocation(turnId);
}
async function openTimeline(){
  closeDrawer(); closeInbox();
  timeline.classList.add('show'); scrim.classList.add('show');
  const active = new URLSearchParams(location.search).get('turn') || '';
  await loadTimeline(active);
}
function closeTimeline(){
  timeline.classList.remove('show');
  if(!drawer.classList.contains('show') && !inboxDrawer.classList.contains('show')) scrim.classList.remove('show');
}
$('#timelineBtn').onclick = openTimeline;
$('#timelineClose').onclick = closeTimeline;

/* ---------- unified inbox / AI dashboard ---------- */
function sourceLabel(source){
  if(source === 'vscode-insiders') return 'VS INSIDERS';
  if(source === 'vscode') return 'VS CODE';
  if(source === 'cli') return 'CLI';
  if(source === 'bridge') return 'BRIDGE';
  return String(source || 'AI').toUpperCase();
}
function updateNotificationButton(){
  const btn = $('#enableNotifyBtn');
  const notice = $('#notificationSetupNotice');
  const message = $('#notificationSetupMessage');
  const setupRequested = initialParams.get('notificationSetup') === '1';
  btn.classList.remove('setup-primary');
  if(!('Notification' in window)){
    btn.textContent='通知不可用'; btn.disabled=true;
    if(setupRequested){ notice.hidden=false; message.textContent='当前浏览器不支持桌面通知。'; }
    return;
  }
  if(Notification.permission === 'granted'){
    btn.textContent='桌面通知已启用'; btn.disabled=true;
    if(setupRequested){ notice.hidden=false; message.textContent='通知已启用，可以关闭此页面。'; }
  }else if(Notification.permission === 'denied'){
    btn.textContent='通知已被浏览器阻止'; btn.disabled=true; notice.hidden=false;
    message.textContent='请点击 Edge 地址栏左侧的站点信息，将“通知”改为“允许”，然后刷新页面。';
  }else{
    btn.textContent='允许浏览器通知'; btn.disabled=false;
    if(setupRequested){ notice.hidden=false; btn.classList.add('setup-primary'); }
  }
}
async function requestBrowserNotifications(){
  if(!('Notification' in window)) return;
  try{ await Notification.requestPermission(); }catch(_){ }
  updateNotificationButton();
}
async function showInboxNotification(item){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const path = item.conversationId
    ? '/?conversation=' + encodeURIComponent(item.conversationId)
    : '/?dashboard=1';
  const options = {
    body: sourceLabel(item.source) + ' · ' + (item.summary || 'AI response completed'),
    tag: 'copilot-bridge-' + item.id,
    data: { url: path },
  };
  try{
    const registration = await navigator.serviceWorker.ready;
    await registration.showNotification(item.title || 'AI response completed', options);
  }catch(_){
    try{
      const notification = new Notification(item.title || 'AI response completed', options);
      notification.onclick = ()=>{ window.focus(); location.href = path; };
    }catch(__){ }
  }
}
function renderSyncStatus(sync){
  sync = sync || {enabled:false,auth:{configured:false,connected:false}};
  const panel=$('#syncSetupPanel'), message=$('#syncStatusMessage');
  const connect=$('#connectSyncBtn'), run=$('#runSyncBtn'), disconnect=$('#disconnectSyncBtn');
  const auth=sync.auth || {};
  const localMode=auth.mode === 'local-folder';
  const setupRequested=initialParams.get('syncSetup') === '1';
  panel.classList.toggle('setup-primary', setupRequested && !auth.connected);
  connect.hidden=!!auth.connected || !sync.enabled;
  run.hidden=!auth.connected;
  disconnect.hidden=!auth.connected;
  connect.disabled=run.disabled=disconnect.disabled=syncBusy || !!sync.running;
  if(syncBusy){ message.textContent=syncBusyMessage; return; }
  if(!sync.enabled){ message.textContent='此版本未启用 OneDrive 同步。'; return; }
  if(!auth.configured){ message.textContent='发布者尚未配置 OneDrive Public Client。'; connect.disabled=true; return; }
  if(sync.running){ message.textContent='正在先上传本机会话，再下载并合并其他设备的会话…'; return; }
  if(!auth.connected && localMode){
    connect.textContent='启用本机 OneDrive';
    message.textContent='使用本机已登录的 OneDrive 文件夹：' + auth.root + '。启用后先上传本机会话，再下载其他电脑的历史。';
    return;
  }
  if(!auth.connected){
    message.textContent='连接后会先导入并上传这台电脑已有的 CLI/VS Code 会话，再下载其他电脑的历史，不会覆盖任一侧。';
    return;
  }
  const result=sync.lastResult || {};
  const parts=[auth.username || 'Microsoft 账号已连接'];
  if(sync.lastSuccess) parts.push('同步于' + relTime(sync.lastSuccess));
  if(result.importedNativeSessions) parts.push('导入本机 ' + result.importedNativeSessions);
  if(result.pushedEventCount) parts.push('上传 ' + result.pushedEventCount);
  if(result.pulledEventCount) parts.push('下载 ' + result.pulledEventCount);
  if(sync.pendingEventCount) parts.push('待上传 ' + sync.pendingEventCount);
  if(sync.lastError) parts.push('错误：' + sync.lastError);
  message.textContent=parts.join(' · ');
}
function renderDashboard(){
  const state = dashboardState || { unreadCount:0, runningJobCount:0, activeJobs:[], inbox:[], watcher:{} };
  $('#unreadStat').textContent = state.unreadCount || 0;
  $('#runningStat').textContent = state.runningJobCount || 0;
  $('#watchedStat').textContent = (state.watcher && state.watcher.sessionsSeen) || 0;
  const unread = state.unreadCount || 0;
  inboxBadge.hidden = unread === 0;
  inboxBadge.textContent = unread > 99 ? '99+' : String(unread);
  inboxList.innerHTML = '';
  if(state.activeJobs && state.activeJobs.length){
    const heading=document.createElement('div'); heading.className='inbox-section'; heading.textContent='正在运行'; inboxList.appendChild(heading);
    for(const job of state.activeJobs){
      const row=document.createElement('div'); row.className='jobrow';
      const dot=document.createElement('span'); dot.className='jobdot';
      const body=document.createElement('div'); body.className='inboxbody';
      const title=document.createElement('div'); title.className='inboxtitle'; title.textContent=job.title || 'Untitled conversation';
      const meta=document.createElement('div'); meta.className='inboxmeta'; meta.textContent=(job.status === 'queued' ? '排队中' : 'AI 正在处理') + ' · ' + relTime(job.createdAt);
      body.append(title,meta); row.append(dot,body);
      row.onclick=()=>{ if(job.conversationId) openSession(job.conversationId); };
      inboxList.appendChild(row);
    }
  }
  const heading=document.createElement('div'); heading.className='inbox-section'; heading.textContent='最近回复'; inboxList.appendChild(heading);
  if(!state.inbox || !state.inbox.length){
    const empty=document.createElement('div'); empty.className='snote'; empty.textContent='还没有新的 AI 回复。'; inboxList.appendChild(empty);
  }else{
    for(const item of state.inbox){
      const row=document.createElement('div'); row.className='inboxitem ' + (item.status === 'unread' ? 'unread' : ''); row.tabIndex=0; row.setAttribute('role','button');
      const source=document.createElement('span'); source.className='sourcepill'; source.textContent=sourceLabel(item.source);
      const body=document.createElement('span'); body.className='inboxbody';
      const title=document.createElement('span'); title.className='inboxtitle'; title.textContent=item.title || 'Untitled conversation';
      const summary=document.createElement('span'); summary.className='inboxsummary'; summary.textContent=item.summary || '(no text)';
      const meta=document.createElement('span'); meta.className='inboxmeta'; meta.textContent=relTime(item.createdAt) + (item.status === 'unread' ? ' · 未读' : ' · 已查看');
      body.append(title,summary,meta);
      const ignore=document.createElement('button'); ignore.type='button'; ignore.className='inboxignore'; ignore.title='忽略'; ignore.textContent='×';
      ignore.onclick=async e=>{ e.stopPropagation(); await api('PATCH','/api/inbox/'+encodeURIComponent(item.id),{status:'ignored'}); await loadDashboard(false); };
      row.append(source,body,ignore);
      row.onclick=()=>openInboxItem(item);
      row.onkeydown=e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openInboxItem(item); } };
      inboxList.appendChild(row);
    }
  }
  updateNotificationButton();
  renderSyncStatus(state.sync);
}
async function loadDashboard(notifyNew=true){
  try{
    const state=await api('GET','/api/dashboard');
    const incoming=(state.inbox || []).filter(item=>item.status === 'unread' && !knownInboxIds.has(item.id));
    if(dashboardInitialized && notifyNew && document.visibilityState !== 'visible'){
      for(const item of incoming) await showInboxNotification(item);
    }
    knownInboxIds=new Set((state.inbox || []).map(item=>item.id));
    dashboardInitialized=true; dashboardState=state; renderDashboard();
  }catch(_){ }
}
async function openInboxItem(item){
  try{ await api('PATCH','/api/inbox/'+encodeURIComponent(item.id),{status:'seen'}); }catch(_){ }
  closeInbox();
  if(item.conversationId) await openSession(item.conversationId);
  else if(item.sourceKey) await importCopilot(item.sourceKey);
  await loadDashboard(false);
}
async function openInbox(){
  closeDrawer(); closeTimeline();
  inboxDrawer.classList.add('show'); scrim.classList.add('show');
  await loadDashboard(false);
}
function closeInbox(){
  inboxDrawer.classList.remove('show');
  if(!drawer.classList.contains('show') && !timeline.classList.contains('show')) scrim.classList.remove('show');
}
$('#inboxBtn').onclick=openInbox;
$('#inboxClose').onclick=closeInbox;
$('#enableNotifyBtn').onclick=requestBrowserNotifications;
async function runSyncAction(path, pendingText){
  if(syncBusy) return;
  syncBusy=true;
  syncBusyMessage=pendingText;
  renderSyncStatus(dashboardState && dashboardState.sync);
  let failure='';
  try{
    const state=await api('POST',path);
    if(dashboardState) dashboardState.sync=state;
    await loadSessions();
    await loadDashboard(false);
  }catch(e){
    failure='同步失败：' + e.message;
  }finally{
    syncBusy=false;
    syncBusyMessage='';
    renderSyncStatus(dashboardState && dashboardState.sync);
    if(failure) $('#syncStatusMessage').textContent=failure;
  }
}
$('#connectSyncBtn').onclick=()=>runSyncAction('/api/sync/connect','请在打开的 Microsoft 登录窗口中完成授权…');
$('#runSyncBtn').onclick=()=>runSyncAction('/api/sync/run','正在先上传本机变化，再下载其他设备的变化…');
$('#disconnectSyncBtn').onclick=()=>runSyncAction('/api/sync/disconnect','正在断开 OneDrive；本地会话不会删除…');
$('#connectSyncBtn').onclick=()=>{
  const auth=dashboardState && dashboardState.sync && dashboardState.sync.auth || {};
  const pending=auth.mode === 'local-folder'
    ? '正在启用本机 OneDrive 文件夹并执行首次同步…'
    : '请在打开的 Microsoft 登录窗口中完成授权…';
  runSyncAction('/api/sync/connect',pending);
};
$('#markInboxSeenBtn').onclick=async()=>{ await api('POST','/api/inbox/mark-all-seen'); await loadDashboard(false); };
$('#scanInboxBtn').onclick=async()=>{
  const btn=$('#scanInboxBtn'); btn.disabled=true;
  try{ await api('POST','/api/inbox/scan'); await loadDashboard(true); }
  finally{ btn.disabled=false; }
};

/* ---------- unified machine-aware history ---------- */
function shortRepo(s){
  if(s.repository) return s.repository;
  if(s.cwd){ const parts = s.cwd.replace(/[\\/]+$/,'').split(/[\\/]/); return parts[parts.length-1] || s.cwd; }
  return '';
}
function renderHistory(data){
  historyItems = (data && data.items) || [];
  historyMachines = (data && data.machines) || [];
  historyMachine = '';
  historyQuery = '';
  slist.innerHTML = '';
  const back = document.createElement('div');
  back.className = 'sback';
  back.innerHTML = '← 返回会话';
  back.onclick = ()=> loadSessions();
  slist.appendChild(back);
  const note = document.createElement('div');
  note.className = 'snote';
  note.textContent = '显示全部机器的会话；选择机器名可筛选。尚未进入 Bridge 的本机会话仍可直接导入。';
  slist.appendChild(note);
  const filters = document.createElement('div');
  filters.id = 'machineFilters';
  filters.className = 'machine-filters';
  slist.appendChild(filters);
  const quality = document.createElement('div');
  quality.id = 'historyQualityFilter';
  slist.appendChild(quality);
  const box = document.createElement('div');
  box.className = 'ssearch';
  box.innerHTML = '<input id="historySearch" type="search" placeholder="搜索机器 / 会话 / 仓库" autocomplete="off" autocapitalize="off" autocorrect="off">';
  slist.appendChild(box);
  const wrap = document.createElement('div');
  wrap.id = 'historyList';
  slist.appendChild(wrap);
  const input = box.querySelector('#historySearch');
  input.addEventListener('input', ()=>{ historyQuery=input.value; renderHistoryItems(); });
  renderMachineFilters();
  renderHistoryQualityFilter();
  renderHistoryItems();
}
function renderMachineFilters(){
  const wrap = document.getElementById('machineFilters');
  if(!wrap) return;
  wrap.innerHTML = '';
  const choices = [{id:'',name:'All'}, ...historyMachines];
  for(const machine of choices){
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'machine-filter' + (historyMachine === machine.id ? ' active' : '');
    button.textContent = machine.name;
    button.onclick = ()=>{
      historyMachine = machine.id;
      renderMachineFilters();
      renderHistoryQualityFilter();
      renderHistoryItems();
    };
    wrap.appendChild(button);
  }
}
function renderHistoryQualityFilter(){
  const wrap = document.getElementById('historyQualityFilter');
  if(!wrap) return;
  const candidates = historyItems.filter(s => !historyMachine || s.machineId === historyMachine);
  wrap.replaceChildren(shortFilterControl(candidates, renderHistoryItems));
}
function renderHistoryItems(){
  const wrap = document.getElementById('historyList');
  if(!wrap) return;
  wrap.innerHTML = '';
  if(!historyItems.length){ wrap.innerHTML = '<div class="snote">没有发现历史会话。</div>'; return; }
  const q = historyQuery.trim().toLowerCase();
  const srcLabel = s => String(s.source || '').startsWith('vscode') ? 'vscode vs code insiders' : (s.source === 'cli' ? 'cli' : '');
  const items = historyItems.filter(s =>{
    if(historyMachine && s.machineId !== historyMachine) return false;
    if(hideShortSessions && s.conversationId !== sid && isShortSession(s)) return false;
    if(!q) return true;
    return ((s.machineName || '') + ' ' + (s.title || '') + ' ' + shortRepo(s) + ' ' + srcLabel(s)).toLowerCase().includes(q);
  });
  if(!items.length){ wrap.innerHTML = '<div class="snote">当前筛选条件下没有会话。</div>'; return; }
  for(const s of items){
    const item = document.createElement('div');
    item.className = 'sitem' + (s.conversationId === sid ? ' active' : '');
    const title = (s.title && s.title.trim()) ? s.title : '未命名会话';
    const machine = s.machineName || 'Unknown device';
    const repo = shortRepo(s);
    const src = s.source === 'vscode-insiders' ? 'VS Code Insiders'
      : (s.source === 'vscode' ? 'VS Code' : (s.source === 'cli' ? 'CLI' : 'Bridge'));
    item.innerHTML = '<div class="stitle"><div class="t"></div><div class="sub"></div></div>'
      + (s.importable ? '<button class="imp">导入</button>' : '');
    item.querySelector('.t').textContent = machine + ' - ' + title;
    item.querySelector('.sub').textContent = [src, repo, relTime(s.updatedAt), (s.messageCount||0) + ' 条'].filter(Boolean).join(' · ');
    const go = ()=> s.importable ? importCopilot(s.sourceKey || s.id) : openSession(s.conversationId);
    item.querySelector('.stitle').onclick = go;
    const importButton = item.querySelector('.imp');
    if(importButton) importButton.onclick = (e)=>{ e.stopPropagation(); go(); };
    wrap.appendChild(item);
  }
}
async function loadHistory(){
  slist.innerHTML = '<div class="snote">正在读取全部机器的历史会话…</div>';
  try{
    renderHistory(await api('GET','/api/history') || {machines:[],items:[]});
  }catch(e){
    slist.innerHTML = '<div class="snote">读取失败：' + esc(e.message) + '</div>';
  }
}
async function importCopilot(id){
  try{
    const s = await api('POST','/api/copilot-sessions/' + encodeURIComponent(id) + '/import');
    sid = s.id; localStorage.setItem('cb_sid', sid);
    await loadSessions();       // refresh the local list (now includes the imported one)
    await openSession(sid);     // load + render its full transcript
  }catch(e){ alert('导入失败：' + e.message); }
}
async function openSession(id, turnToReveal){
  try{
    // Re-sync from the server on (re)select: this merges any turns made by
    // talking to Copilot directly on the host into the server store, so the
    // web client always shows the complete, reconciled transcript.
    let s;
    try{ s = await api('POST','/api/sessions/' + encodeURIComponent(id) + '/sync'); }
    catch(_){ s = await api('GET','/api/sessions/' + encodeURIComponent(id)); }
    sid = s.id; localStorage.setItem('cb_sid', sid);
    log.innerHTML = '';
    if(!s.messages || !s.messages.length){
      addMsg('bot','新会话已就绪 ✨ 发条指令试试。');
    } else {
      for(const m of s.messages){
        const kind = m.role === 'user' ? 'user' : (m.ok === false ? 'err' : 'bot');
        const imgs = (m.attachments || []).filter(a => a && a.url).map(a => ({ src: attUrl(a), name: a.name }));
        addMsg(kind, m.text || '', imgs, m.turnId);
      }
    }
    renderSessions(); closeDrawer(); closeTimeline(); closeInbox();
    await loadTimeline(turnToReveal);
    updateLocation(turnToReveal || '');
    if(turnToReveal){
      requestAnimationFrame(()=>{
        const target = findTurnElement(turnToReveal);
        if(target){
          target.scrollIntoView({ block:'start' });
          target.classList.add('turn-flash');
          setTimeout(()=>target.classList.remove('turn-flash'), 1400);
        }
      });
    }
  }catch(e){ addMsg('err','打开会话失败：' + e.message); }
}
async function newSession(){
  try{
    const s = await api('POST','/api/sessions', { title: '' });
    sid = s.id; localStorage.setItem('cb_sid', sid);
    await loadSessions();
    turns = []; renderTimeline();
    log.innerHTML = ''; addMsg('bot','已开始新会话 ✨'); closeDrawer(); closeTimeline(); closeInbox(); updateLocation('');
  }catch(e){ addMsg('err','新建会话失败：' + e.message); }
}
async function delSession(id, title){
  if(!confirm('删除会话「' + title + '」？此操作不可恢复。')) return;
  try{
    await api('DELETE','/api/sessions/' + encodeURIComponent(id));
    if(id === sid){ sid = ''; localStorage.removeItem('cb_sid'); }
    await loadSessions();
    if(!sid){ sessions.length ? openSession(sessions[0].id) : newSession(); }
  }catch(e){ addMsg('err','删除失败：' + e.message); }
}
async function ensureSession(){
  if(sid){
    try{ await api('GET','/api/sessions/' + encodeURIComponent(sid)); return; }
    catch(e){ sid = ''; }
  }
  await loadSessions();
  if(sessions.length) sid = sessions[0].id;
  else { const s = await api('POST','/api/sessions', { title:'' }); sid = s.id; }
  localStorage.setItem('cb_sid', sid);
}

/* ---------- drawer ---------- */
function openDrawer(){ closeTimeline(); closeInbox(); drawer.classList.add('show'); scrim.classList.add('show'); loadSessions(); }
function closeDrawer(){
  drawer.classList.remove('show');
  if(!timeline.classList.contains('show') && !inboxDrawer.classList.contains('show')) scrim.classList.remove('show');
}
$('#menuBtn').onclick = openDrawer;
scrim.onclick = ()=>{ closeDrawer(); closeTimeline(); closeInbox(); };
$('#newBtn').onclick = newSession;
$('#importBtn').onclick = loadHistory;

/* ---------- send ---------- */
async function poll(jobId, thinking){
  for(;;){
    await sleep(1200);
    const j = await api('GET','/api/chat/' + jobId);
    if(thinking && thinking._update) thinking._update(j);
    if(j.status === 'done') return j;
  }
}
async function send(text){
  const imgs = pending.slice();
  addMsg('user', text, imgs.map(p => ({ src: p.dataUrl, name: p.name })));
  input.value = ''; input.style.height = 'auto';
  pending = []; renderPending();
  sendBtn.disabled = true;
  let thinking;
  try{
    await ensureSession();
    const payload = { message: text, conversationId: sid, reset: false };
    if(imgs.length) payload.images = imgs.map(p => ({ name: p.name, mime: p.mime, data: p.b64 }));
    const start = await api('POST','/api/chat', payload);
    thinking = addThinking(start);
    const res = await poll(start.jobId, thinking);
    thinking._stop(); thinking.remove();
    addMsg(res.ok === false ? 'err' : 'bot', res.reply || '(无输出)');
    if(res.inboxItemId && document.visibilityState === 'visible'){
      try{ await api('PATCH','/api/inbox/'+encodeURIComponent(res.inboxItemId),{status:'seen'}); }catch(_){ }
    }
    loadSessions();   // refresh titles / ordering / counts
    loadTimeline();
    loadDashboard(true);
  }catch(e){
    if(thinking){ thinking._stop(); thinking.remove(); }
    if(e.message === 'unauthorized') addMsg('err','未授权：请点右上角 ⚙ 填写正确的 API Token');
    else addMsg('err','连接失败：' + e.message + '（确认 server 和 devtunnel 都在运行）');
  }finally{
    updateSendEnabled();
  }
}
form.addEventListener('submit', e=>{ e.preventDefault(); const t=input.value.trim(); if(t || pending.length) send(t); });
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
input.addEventListener('input', ()=>{ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,140)+'px'; updateSendEnabled(); });

/* ---------- attach images (button, file picker, paste) ---------- */
attachBtn.onclick = ()=> fileInput.click();
fileInput.onchange = ()=>{ addFiles([...fileInput.files]); fileInput.value=''; };
input.addEventListener('paste', e=>{
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for(const it of items){ if(it.kind === 'file' && it.type && it.type.startsWith('image/')){ const f = it.getAsFile(); if(f) files.push(f); } }
  if(files.length){ e.preventDefault(); addFiles(files); }
});
updateSendEnabled();

/* ---------- Microsoft Entra ID sign-in ---------- */
function msScopes(){
  const e = (authCfg && authCfg.entra) || {};
  if(Array.isArray(e.scopes) && e.scopes.length) return e.scopes;
  return e.clientId ? ['api://' + e.clientId + '/access_as_user'] : [];
}
async function initAuth(cfg){
  authCfg = cfg || {};
  const e = authCfg.entra;
  msalApp = null; msAccount = null;
  if(!e || !e.clientId || !(e.authority || e.tenantId) || typeof msal === 'undefined') return;
  try{
    msalApp = new msal.PublicClientApplication({
      auth: {
        clientId: e.clientId,
        authority: e.authority || ('https://login.microsoftonline.com/' + e.tenantId),
        redirectUri: location.origin + '/',
        // Process the sign-in response on whatever page we land on and stay put.
        // The default (true) makes MSAL navigate again to the page that started
        // login; over a Dev Tunnel each extra top-level navigation risks the
        // one-time anti-phishing interstitial, which breaks the redirect on phones.
        navigateToLoginRequestUrl: false,
      },
      cache: { cacheLocation: 'localStorage' },
    });
    await msalApp.initialize();
    const res = await msalApp.handleRedirectPromise();
    if(res && res.account) msAccount = res.account;
    if(!msAccount){
      const accts = msalApp.getAllAccounts();
      if(accts.length) msAccount = accts[0];
    }
    if(msAccount) await acquireToken(true);
  }catch(err){ console.warn('MSAL init failed', err); msalApp = null; }
}
async function acquireToken(silentOnly){
  if(!msalApp || !msAccount) return '';
  const scopes = msScopes();
  try{
    const r = await msalApp.acquireTokenSilent({ account: msAccount, scopes });
    msToken = r.accessToken;
    msTokenExp = r.expiresOn ? r.expiresOn.getTime() : (Date.now() + 50*60*1000);
    return msToken;
  }catch(err){
    if(silentOnly) return '';
    try{ await msalApp.acquireTokenRedirect({ scopes, account: msAccount }); }catch(e){}
    return '';
  }
}
async function signIn(){
  if(!msalApp){ addMsg('err','此服务未配置 Microsoft 登录。'); return; }
  try{ await msalApp.loginRedirect({ scopes: msScopes() }); }
  catch(err){ addMsg('err','登录失败：' + ((err && err.message) || err)); }
}
async function signOut(){
  msToken=''; msTokenExp=0;
  const acct = msAccount; msAccount=null;
  if(msalApp && acct){ try{ await msalApp.logoutRedirect({ account: acct }); }catch(e){} }
}
function updateAuthUI(){
  const mode = (authCfg && authCfg.authMode) || 'apikey';
  const hasEntra = !!(authCfg && authCfg.entra && authCfg.entra.clientId);
  const showMs = hasEntra && (mode === 'entra' || mode === 'both');
  const msB = $('#msBlock'), tkB = $('#tokenBlock');
  if(msB) msB.style.display = showMs ? '' : 'none';
  if(tkB) tkB.style.display = (mode === 'entra' || mode === 'tunnel') ? 'none' : '';
  const signedIn = !!msAccount;
  const si = $('#msSignIn'), so = $('#msSignOut'), st = $('#msStatus');
  if(si) si.style.display = signedIn ? 'none' : '';
  if(so) so.style.display = signedIn ? '' : 'none';
  if(st) st.textContent = signedIn ? ('已登录：' + (msAccount.username || msAccount.name || '')) : '未登录';
}

/* ---------- settings ---------- */
const modal = $('#modal');
function openModal(){
  $('#baseInput').value = base;
  $('#tokenInput').value = token;
  $('#previewLengthInput').value = appSettings.promptPreviewLength || 200;
  updateAuthUI(); modal.classList.add('show');
}
$('#setBtn').onclick = openModal;
$('#cancelBtn').onclick = ()=> modal.classList.remove('show');
$('#msSignIn').onclick = ()=> signIn();
$('#msSignOut').onclick = async ()=>{ await signOut(); updateAuthUI(); };
$('#saveBtn').onclick = async ()=>{
  base = ($('#baseInput').value.trim() || location.origin).replace(/\/$/,'');
  token = $('#tokenInput').value.trim();
  localStorage.setItem('cb_base', base); localStorage.setItem('cb_token', token);
  const previewLength = Number($('#previewLengthInput').value);
  if(!Number.isInteger(previewLength) || previewLength < 20 || previewLength > 1000){
    alert('预览字符数必须是 20 到 1000 之间的整数。');
    return;
  }
  try{
    appSettings = await api('PATCH','/api/settings',{ promptPreviewLength: previewLength });
    modal.classList.remove('show');
    await boot(true);
  }catch(e){ alert('保存设置失败：' + e.message); }
};

/* ---------- boot ---------- */
async function boot(quiet){
  let cfg;
  try{
    cfg = await api('GET','/api/webconfig');
  }catch(e){ if(!quiet) addMsg('err','连不上服务器：' + e.message); return; }
  await initAuth(cfg);
  const mode = cfg.authMode || (cfg.authRequired ? 'apikey' : 'none');
  if(mode === 'tunnel'){
    token = '';
    localStorage.removeItem('cb_token');
  }
  updateAuthUI();
  if(mode === 'entra'){
    if(!msToken){ addMsg('bot','请用 Microsoft 账号登录（点右上角 ⚙）。'); openModal(); return; }
  } else if(mode === 'both'){
    if(!msToken && !token){ addMsg('bot','请用 Microsoft 账号登录，或填写 API Token（点右上角 ⚙）。'); openModal(); return; }
  } else {
    if(cfg.authRequired && !token){ addMsg('bot','⚠️ 这个服务需要 API Token，请点右上角 ⚙ 填写。'); openModal(); return; }
  }
  try{ appSettings = await api('GET','/api/settings'); }catch(_){ appSettings = { promptPreviewLength: 200 }; }
  await loadDashboard(false);
  if(!dashboardTimer) dashboardTimer=setInterval(()=>loadDashboard(true),5000);
  await loadSessions();
  if(sessions.length){
    const targetSession = sessions.some(s=>s.id===sid) ? sid : sessions[0].id;
    const targetTurn = targetSession === sid ? initialTurnId : '';
    initialTurnId = '';
    await openSession(targetSession, targetTurn);
  }
  else await newSession();
  if(initialParams.get('dashboard') === '1') await openInbox();
  if(initialParams.get('notificationSetup') === '1' && 'Notification' in window && Notification.permission === 'default'){
    $('#enableNotifyBtn').focus();
  }else if(initialParams.get('syncSetup') === '1' && dashboardState && dashboardState.sync && !dashboardState.sync.auth.connected){
    $('#connectSyncBtn').focus();
  }
}
boot(false);

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') loadDashboard(false);
});

if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
